name: Multiple Architecture Image Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'main'
      - 'release-*'
  push:
    branches:
      - 'main'
      - 'release-*'
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-build:
    uses: konveyor/release-tools/.github/workflows/build-push-images.yaml@main
    with:
      registry: "quay.io/konveyor"
      image_name: "jdtls-server-base"
      containerfile: "./Dockerfile"
      architectures: '[ "amd64", "arm64" ]'
      # Build-only: product images are published by Konflux, not by this
      # workflow. Publishing here would target quay.io/konveyor (owned by the
      # upstream repo), which this fork is not authorized to push to.
      publish: 'false'
    secrets:
      registry_username: ${{ secrets.QUAY_PUBLISH_ROBOT }}
      registry_password: ${{ secrets.QUAY_PUBLISH_TOKEN }}
